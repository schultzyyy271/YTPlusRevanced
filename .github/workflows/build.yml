name: Build YouTubePlusRevanced

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      youtube_version:
        description: 'YouTube version to target'
        required: false
        default: '21.24.3'
      scheme:
        description: 'Package scheme'
        type: choice
        options:
          - rootless
          - rootful
          - roothide
        default: rootless
      create_release:
        description: 'Create a GitHub Release'
        type: boolean
        default: false

env:
  THEOS: ${{ github.workspace }}/theos
  YOUTUBE_VERSION: ${{ inputs.youtube_version || '21.24.3' }}
  SCHEME: ${{ inputs.scheme || 'rootless' }}

jobs:
  build:
    name: Build deb (${{ inputs.scheme || 'rootless' }}, ${{ matrix.diag && 'diag' || 'release' }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        diag: [false, true]
    env:
      DIAG: ${{ matrix.diag && '1' || '0' }}

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ── 2. Install Theos (manual clone — avoids SDK rate-limit failure) ───
      - name: Install Theos
        run: |
          # Install dependencies
          brew install ldid xz

          # Clone Theos directly (skip the install script's SDK download)
          git clone --recursive https://github.com/theos/theos.git $THEOS

      # ── 3. iOS SDK ─────────────────────────────────────────────────────────
      - name: Fetch iOS SDKs
        run: |
          mkdir -p "$THEOS/sdks"

          # Try multiple SDK sources in case one fails
          SDK_URLS=(
            "https://github.com/theos/sdks/archive/master.tar.gz"
            "https://github.com/nicklama/theos-sdks/archive/master.tar.gz"
          )

          for url in "${SDK_URLS[@]}"; do
            echo "Trying: $url"
            if curl -fsSL "$url" | tar xz --strip-components=1 -C "$THEOS/sdks" 2>/dev/null; then
              echo "✓ SDKs downloaded successfully"
              break
            else
              echo "✗ Failed, trying next..."
            fi
          done

          echo "Available SDKs:"
          ls "$THEOS/sdks"

      # ── 4. Build ───────────────────────────────────────────────────────────
      - name: Build deb
        run: |
          case "$SCHEME" in
            rootless) export THEOS_PACKAGE_SCHEME=rootless ;;
            roothide) export THEOS_PACKAGE_SCHEME=roothide ;;
            rootful)  unset THEOS_PACKAGE_SCHEME ;;
          esac

          echo "Building with DIAG=${DIAG}"
          make clean package \
            DEBUG=0 \
            FINALPACKAGE=1 \
            DIAG="${DIAG}" \
            YOUTUBE_VERSION="${YOUTUBE_VERSION}"

      # ── 5. Verify deb has the dylib ───────────────────────────────────────────
      - name: Verify deb contents
        run: |
          DEB=$(find packages/ .theos/debs/ -name "*.deb" 2>/dev/null | head -1)
          if [ -z "$DEB" ]; then
            echo "::error::No .deb found after build"
            exit 1
          fi
          echo "Package: $DEB ($(du -h "$DEB" | cut -f1))"

          # Extract deb to inspect contents (dpkg-deb not available on macOS)
          mkdir -p /tmp/deb-inspect
          cd /tmp/deb-inspect
          ar -x "$GITHUB_WORKSPACE/$DEB"
          tar xf data.tar.* 2>/dev/null || true
          echo ""
          echo "── Deb contents ──"
          find . -type f | sort | tee /tmp/deb-files.txt

          echo ""
          echo "── Checking for dylib ──"
          if grep -q "YouTubePlusRevanced.dylib" /tmp/deb-files.txt; then
            echo "✓ YouTubePlusRevanced.dylib (includes iSponsorBlock inline)"
          else
            echo "::warning::YouTubePlusRevanced.dylib not found"
          fi

          echo ""
          echo "── Bundles found ──"
          grep "\.bundle" /tmp/deb-files.txt || echo "(none)"

      # ── 6. Upload artifact ─────────────────────────────────────────────────
      - name: Collect deb
        id: collect
        run: |
          mkdir -p artifacts
          DEB=$(find packages/ .theos/debs/ -name "*.deb" 2>/dev/null | head -1)
          SUFFIX=""
          [ "$DIAG" = "1" ] && SUFFIX="-DIAG"
          BASE=$(basename "$DEB" .deb)
          OUT="${BASE}${SUFFIX}.deb"
          cp "$DEB" "artifacts/${OUT}"
          echo "deb_name=${OUT}" >> "$GITHUB_OUTPUT"

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.collect.outputs.deb_name }}
          path: artifacts/*.deb
          if-no-files-found: error

  # ── Release (manual only) ──────────────────────────────────────────────────
  release:
    name: Create Release
    needs: build
    if: ${{ inputs.create_release == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.YOUTUBE_VERSION }}-${{ github.run_number }}
          name: YouTubePlusRevanced v${{ env.YOUTUBE_VERSION }} (Build ${{ github.run_number }})
          body: |
            ### YouTubePlusRevanced v${{ env.YOUTUBE_VERSION }}
            **Scheme:** ${{ env.SCHEME }}

            #### Package contents
            - `YouTubePlusRevanced.dylib` — single dylib (all tweaks + iSponsorBlock compiled inline)
            - Resource bundles

            Install `.deb` via package manager, Filza, or `dpkg -i`.
          files: release-assets/*
          draft: false
          prerelease: false
        env:
          YOUTUBE_VERSION: ${{ inputs.youtube_version || '21.24.3' }}
          SCHEME: ${{ inputs.scheme || 'rootless' }}
